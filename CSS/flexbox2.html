<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container {
            display: flex;
            background-color: aqua;
            height: 200px;

            /* align-item- အပေါ်အောက်ညှိ
            flex-start, flex-end, center */
            align-items: center;

            /* gap- element တစ်ခုနဲ့တစ်ခုကြား အကွာအ‌ဝေး
             margin နဲ့မတူတာက ဘေးဘယ်ညာမယူ */ 
            gap: 20px;
        }
        .flex-item {
            background-color: lightblue;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <p class="flex-item">Item 1</p>
        <p class="flex-item">Item 2</p>
        <p class="flex-item">Item 3</p>
    </div>
</body>
</html>
