<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 a:hover {
            color: red;
            background-color: black;
            font-size: 40px;
        }
        h1:hover {
            color: aqua;
        }
        h2 a:link {
            color: orange;
        }
        h2 a:visited {
            color: green;
        }
        h2 a:active {
            color: yellow;
        }
        input[type="text"]:focus {
            background-color: brown;
            color: white;
        }
        ul li:first-child {
            color: green;
        }
        ul li:last-child {
            color: red;
        }

    </style>
</head>
<body>
    <h1>Pseudo Selector</h1>
    <h1>
        <a href="">Hover Selector</a>
    </h1>

    <h2>
        <a href="https://google.com" target="_blank">Google</a>
        <a href="https://youtube.com" target="_blank">Youtube</a>
        <a href="https://bbc.com" target="_blank">BBC</a>
        <a href="https://reuters.com" target="_blank">Reuters</a>
    </h2>
    <input type="text" name="" id="">
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>PHP</li>
    </ul>
</body>
</html>
