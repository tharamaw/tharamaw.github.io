<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Display
         block - width, height သုံးလို့ရ padding margin သုံးလို့ရ
        */

        a {
            display: block;
            border: 5px solid red;
            padding: 20px;
            margin: 20px;
            width: 50%;
            height: 100px;
        }

        /* inline-block အလုပ်က inline အတိုင်း width and heightသုံးရ */

        h1 {
            display: inline-block;
            border: 3px solid black;
            padding: 30px;
            margin: 30px;
            width: 500px;
            height: 100px;
        }

        /* inline */
        h2 {
            display: inline;
        }

        h3 {
            display: none;
        }
    </style>
</head>
<body>
    <a href="https://heinlearn.com">HeinLearn - Learning with pratice</a>
    <a href="https://heinlearn.com">HeinLearn</a>

    <h1>HeinLearn Training School</h1>
    <h1>HeinLearn Training School</h1>
    
    <h2>HeinLearn - Learning Center</h2>
    <h2>HeinLearn - Learning Center</h2>

    <h3>Display None</h3>
    
</body>
</html>
