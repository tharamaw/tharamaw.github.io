<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            padding: 20px;
        }
        .card-item {
            background-color: #0f0;
            margin: 10px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.785rem;
        }

        /* 
         @media mediatype and (condition) {
          css code
         }

         media type
         -all
         -screen -> computer, phone, laptop
         -print
         -speech

         phone screen -> max-width: 767px
         tablet screen -> min width: 768px -> max width: 1023px
         laptop screen -> min width: 1024px
         */

         /* For desktop */
         @media screen and (min-width: 1024px) {
            .card {
                display: grid;
                grid-template-columns: repeat(3,1fr);
            }
         }  

         @media screen and (min-width: 768px) and (max-width: 1023px) {
            .card {
                display: grid;
                grid-template-columns: repeat(2,1fr);
            }
         }
         @media screen and (max-width: 767px) {
            .card {
                color: white;
            }
         }
        </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-item">Card1</div>
            <div class="card-item">Card2</div>
            <div class="card-item">Card3</div>
            <div class="card-item">Card4</div>
            <div class="card-item">Card5</div>
        </div>
    </div>
</body>
</html>
