<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration</h1>
    <form action="request.html">
        <label for="name">Name</label>
        <input type="text" name="stu_name" id="name" required>
        <br><br>
        <label for="email">Email</label>
        <input type="email" name="stu_email" id="email" required>
        <br><br>
        <label for="phone">Phone</label>
        <input type="number" name="stu_phone" id="phone" required>
        <br><br>
        <label for="password">Password</label>
        <input type="password" name="stu_password" id="password" required>
        <br><br>
        <label for="dob">Date of Birth</label>
        <input type="date" name="stu_dob" id="dob">
        <br><br>
        <label for="passport">Passport</label>
        <input type="file" accept=".png,.jpg" name="stu_passport" id="passport">
        <br><br>
        <label for="year">Years</label>
        <select name="stu_year" id="year">
            <option value="">Choose Year</option>
            <option value="1">First Year</option>
            <option value="2">Second Year</option>
            <option value="3">Third Year</option>
            <option value="4">Fourth Year</option>
        </select>
        <br><br>
        <label for="Gender">Gender</label>
        <br><br>
        <input type="radio" name="Gender" id="male" value="Male"><label for="male">Male</label>
        <input type="radio" name="Gender" id="female" value="Female"><label for="female">female</label>
        <br><br><label for="hobby">Hobby</label>
        <br><br>
        <input type="checkbox" name="reading" id="reading" value="Reading"><label for="reading">Reading</label>
        <input type="checkbox" name="gaming" id="gaming" value="Gaming"><label for="gaming">Gaming</label>
        <input type="checkbox" name="swimming" id="swimming" value="Swimming"><label for="swimming">swimming</label>
        <br><br>
        <label for="address">Address</label>
        <textarea name="stu_address" id="address" rows="10" cols="30"></textarea>
        <br><br>
        <input type="time" name="" id="">
        <input type="range" min="0" max="100" name="" id="">
        <input type="color" name="" id="">
        <input type="text" name="city1" id="" value="Mandalay">
        <input type="text" name="city2" id="" value="Yangon" readonly>
        <input type="text" name="plac" id="" placeholder="eg-09783047470">
        <br><br>
        <button type="submit">Save</button>

    </form>
</body>
</html>
