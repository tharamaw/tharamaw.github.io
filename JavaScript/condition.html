<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        // Condition
        // if

        let number = 2;
        if (number > 0) {
            document.write("<h1> Number is greater than Zero </h1>")
        }

        // if else
        let num = 15;
        if (num > 10) {
            document.write("<h1> Number is greater than Ten </h1>")

        }else {
            document.write("<h1> Number is greater than Ten </h1>")
        }

        // if else if else
        let n = prompt("Enter a Number")

        if (n > 10) {
            document.write("<h1> N is greater than Ten </h1>")
        }else if (n == 10) {
            document.write("<h1> N is equal to Ten </h1>")
        }else if ( n < 10) {
            document.write("<h1> N is less than Ten </h1>")
        }else {
            document.write("<h1> N is not a number </h1>")
        }
            
    </script>
</head>

</body>
</html>
