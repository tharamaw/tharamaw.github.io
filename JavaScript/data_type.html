<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        // Data Type

        // String date 
        let name = "Thara Maw";
        console.log(name);
        console.log(typeof(name));

        let job = 'Web Developer';
        console.log(job);
        console.log(typeof(job));

        // backtick sign 
        let part_time = `By one trainer`;
        console.log(part_time);
        console.log(typeof(part_time));
               
        let num = "3";
        console.log(num);
        console.log(typeof(num));
        let sum = "3" + "3"
        console.log(sum);

        // Number Datatype 
        let age = 22;
        console.log(age);
        console.log(typeof(age));
        
        let pi = 3.14;
        console.log(pi);
        console.log(typeof(pi));
        let numsum = age + pi;
        console.log(numsum);
        console.log(typeof(numsum));  
        
        
        // Boolean datetype
        let js = true;
        console.log(js)
        console.log(typeof(js));
        let ruby = false;
        console.log(ruby);
        console.log(typeof(ruby));
        let abc = "true"
        console.log(abc);
        console.log(typeof(abc));
        
        
        // Array 
        let arr = ["Mg Mg", 'Myanmar', 2026, true];
        console.log(arr);
        console.log(typeof(arr));
        console.log(arr[0]);
        console.log(arr[1]);
        console.log(arr[2]);
        console.log(arr[3]);

        let arr2 = [11,22,33,'aa',"bb",`cc`,['x',"y",true]]
        console.log(arr2);
        console.log(typeof(arr2));
        console.log(arr2[0]);
        console.log(arr2[5]);
        console.log(arr2[6][0]);
        
        let arr1 = new Array("Apple",'Orange','Banana')
        console.log(arr1);
        console.log(typeof(arr1));   

        let arr3 = [["Mg Mg","Ma Ma","Aung Aung"],["Mandalay", "Yangon", "Monywa"],[23,24,28]]
        console.log(arr3);
        console.log(typeof(arr3));
        console.log(arr3[0][0]);
        console.log(arr3[1][0]);
        console.log(arr3[2][0]);

        

    </script>
</head>
<body>
    
</body>
</html>
