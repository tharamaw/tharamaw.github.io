<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // Operator
        // Assignment operator
        let three = 1 + 2;
        console.log(three);
        let four = three + 1;
        console.log(four);

        let three1 = 'three' + 1
        console.log(three1);
        let strsum = '23' + '32'
        console.log(strsum);
        let number = 5;
        number += 5
        console.log(number);    
        
        // Substratioin operator (-)
        let two = 3 - 1;
        console.log(two);
        let five = '6' - '1';
        console.log(five);
        let num = 25;
        num -= 5;
        console.log(num);
        
        // Division operator
        let dev1 = 20/5;
        console.log(dev1);
        let dev2 = 20 / 7;
        console.log(dev2.toFixed(2));
        let div = 20;
        div /= 5;
        console.log(div);
        
        // Reaminter operator
        let rem1 = 20 % 5;
        console.log(rem1);
        let rem2 = 20 % 7;
        console.log(rem2);
        let rem3 = 1 % 0;
        console.log(rem3);
        let rem = 25;
        rem %= 2;
        console.log(rem);

        // Mulitplication operator
        let mul1 = 12 * 12;
        console.log(mul1);
        let mul = 25;
        mul *= 5;
        console.log(mul);
        
        
        // Exponentiatin operator
        let exp1 = 2 ** 2;
        console.log(exp1);
        let exp2 = 4 ** 6;
        console.log(exp2);
        
        
        // Precendence
        // * / %
        // + -

        let total = 5 * 6 + 7- 9 % 2 / 3;
        console.log(total);
        
        
        
        
    </script>
